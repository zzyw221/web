<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片</title>
    <!-- 引入外部样式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 名片卡片容器，垂直水平居中 -->
    <div class="card">
        <!-- 圆形头像区域 -->
        <div class="avatar">
            <!-- 头像占位符（可使用真实图片替换） -->
            <img src="https://api.dicebear.com/7.x/initials/svg?seed=ZWT" alt="头像">
        </div>
        <!-- 个人信息区域 -->
        <div class="info">
            <h1 class="name">张文涛</h1>
            <p class="position">高级前端工程师</p>
            <p class="company">星辰科技有限公司</p>
        </div>
        <!-- 联系方式区域 -->
        <div class="contact">
            <div class="contact-item">
                <span class="icon">📧</span>
                <a href="mailto:zhangwentao@example.com">zhangwentao@example.com</a>
            </div>
            <div class="contact-item">
                <span class="icon">📱</span>
                <a href="tel:+8613800138000">+86 138-0013-8000</a>
            </div>
            <div class="contact-item">
                <span class="icon">🌐</span>
                <a href="https://example.com" target="_blank">www.example.com</a>
            </div>
            <div class="contact-item">
                <span class="icon">📍</span>
                <span>北京市朝阳区</span>
            </div>
        </div>
    </div>
</body>
</html>
